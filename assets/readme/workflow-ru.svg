<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="1160" viewBox="0 0 1200 1160"
     role="img" aria-labelledby="title desc">
  <title id="title">Полный цикл Project Atlas</title>
  <desc id="desc">Atlas сначала спрашивает владельца о продукте, показывает прогноз токенов, изучает разрешённый код, собирает доказательства, уточняет готовую карту и создаёт проверяемые задачи на будущее.</desc>

  <rect width="1200" height="1160" rx="26" fill="#071018"/>
  <rect x="1.5" y="1.5" width="1197" height="1157" rx="24.5"
        fill="none" stroke="#36576A" stroke-width="3"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="54" y="72" fill="#F8FAFC" font-size="52" font-weight="780">
      От вопросов — к следующей задаче
    </text>

    <g id="route" fill="none" stroke="#67E8F9" stroke-width="5">
      <path d="M600 230V254"/>
      <path d="M600 408V432"/>
      <path d="M600 586V610"/>
      <path d="M600 764V788"/>
      <path d="M600 942V966"/>
    </g>
    <g fill="#67E8F9">
      <path d="M584 250H616L600 270Z"/>
      <path d="M584 428H616L600 448Z"/>
      <path d="M584 606H616L600 626Z"/>
      <path d="M584 784H616L600 804Z"/>
      <path d="M584 962H616L600 982Z"/>
    </g>

    <g id="step-start">
      <rect x="54" y="112" width="1092" height="118" rx="18"
            fill="#0E1D28" stroke="#416B7F" stroke-width="3"/>
      <text x="84" y="164" fill="#67E8F9" font-size="46" font-weight="800">01</text>
      <text x="190" y="164" fill="#F8FAFC" font-size="46" font-weight="800">
        СПРАШИВАЕТ
      </text>
      <text x="570" y="164" fill="#AFC1CB" font-size="42" font-weight="650">
        Цель, границы, риски
      </text>
      <text x="570" y="210" fill="#AFC1CB" font-size="42" font-weight="650">
        и направление продукта
      </text>
    </g>

    <g id="step-budget">
      <rect x="54" y="290" width="1092" height="118" rx="18"
            fill="#0E1D28" stroke="#416B7F" stroke-width="3"/>
      <text x="84" y="342" fill="#67E8F9" font-size="46" font-weight="800">02</text>
      <text x="190" y="342" fill="#F8FAFC" font-size="46" font-weight="800">
        ОЦЕНИВАЕТ
      </text>
      <text x="570" y="342" fill="#AFC1CB" font-size="42" font-weight="650">
        Min · обычно · max
      </text>
      <text x="570" y="388" fill="#AFC1CB" font-size="42" font-weight="650">
        токенов до каждого блока
      </text>
    </g>

    <g id="step-map">
      <rect x="54" y="468" width="1092" height="118" rx="18"
            fill="#0E1D28" stroke="#416B7F" stroke-width="3"/>
      <text x="84" y="520" fill="#67E8F9" font-size="46" font-weight="800">03</text>
      <text x="190" y="520" fill="#F8FAFC" font-size="46" font-weight="800">
        ИЗУЧАЕТ
      </text>
      <text x="570" y="520" fill="#AFC1CB" font-size="42" font-weight="650">
        Только разрешённый код
      </text>
      <text x="570" y="566" fill="#AFC1CB" font-size="42" font-weight="650">
        безопасными командами
      </text>
    </g>

    <g id="step-evidence">
      <rect x="54" y="646" width="1092" height="118" rx="18"
            fill="#0E1D28" stroke="#416B7F" stroke-width="3"/>
      <text x="84" y="698" fill="#67E8F9" font-size="46" font-weight="800">04</text>
      <text x="190" y="698" fill="#F8FAFC" font-size="46" font-weight="800">
        ДОКАЗЫВАЕТ
      </text>
      <text x="570" y="698" fill="#AFC1CB" font-size="42" font-weight="650">
        Факты, выводы
      </text>
      <text x="570" y="744" fill="#AFC1CB" font-size="42" font-weight="650">
        и честные UNKNOWN
      </text>
    </g>

    <g id="step-finish">
      <rect x="54" y="824" width="1092" height="118" rx="18"
            fill="#0E1D28" stroke="#416B7F" stroke-width="3"/>
      <text x="84" y="876" fill="#67E8F9" font-size="46" font-weight="800">05</text>
      <text x="190" y="876" fill="#F8FAFC" font-size="46" font-weight="800">
        УТОЧНЯЕТ
      </text>
      <text x="570" y="876" fill="#AFC1CB" font-size="42" font-weight="650">
        Черновик карты
      </text>
      <text x="570" y="922" fill="#AFC1CB" font-size="42" font-weight="650">
        и финальные вопросы
      </text>
    </g>

    <g id="step-next">
      <rect x="54" y="1002" width="1092" height="118" rx="18"
            fill="#102532" stroke="#67E8F9" stroke-width="4"/>
      <text x="84" y="1054" fill="#67E8F9" font-size="46" font-weight="800">06</text>
      <text x="190" y="1054" fill="#F8FAFC" font-size="46" font-weight="800">
        ОТДАЁТ
      </text>
      <text x="570" y="1054" fill="#AFC1CB" font-size="42" font-weight="650">
        Карту + проверяемые
      </text>
      <text x="570" y="1100" fill="#AFC1CB" font-size="42" font-weight="650">
        задачи на будущее
      </text>
    </g>
  </g>
</svg>
