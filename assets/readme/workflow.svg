<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="330" viewBox="0 0 1200 330"
     role="img" aria-labelledby="title desc">
  <title id="title">Project Atlas workflow</title>
  <desc id="desc">Four connected stages: bound discovery, classify evidence, select depth, and deliver the atlas.</desc>

  <defs>
    <marker id="flow-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L9 4.5L0 9Z" fill="#6EE7F9"/>
    </marker>
  </defs>

  <rect width="1200" height="330" rx="26" fill="#071018"/>
  <rect x="1.5" y="1.5" width="1197" height="327" rx="24.5"
        fill="none" stroke="#426D82" stroke-width="3"/>

  <text x="54" y="64" fill="#F5F7FA" font-size="42" font-weight="700"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    One contract. Four deliberate stages.
  </text>

  <g id="workflow-route" fill="none" stroke="#6EE7F9" stroke-width="3">
    <path d="M298 192H330" marker-end="url(#flow-arrow)"/>
    <path d="M582 192H614" marker-end="url(#flow-arrow)"/>
    <path d="M866 192H898" marker-end="url(#flow-arrow)"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g id="stage-bound">
      <rect x="54" y="104" width="244" height="164" rx="18"
            fill="#0D1B26" stroke="#426D82" stroke-width="2"/>
      <text x="78" y="170" fill="#6EE7F9" font-size="48" font-weight="700">01</text>
      <text x="78" y="229" fill="#F5F7FA" font-size="40" font-weight="700">BOUND</text>
    </g>

    <g id="stage-classify">
      <rect x="338" y="104" width="244" height="164" rx="18"
            fill="#0D1B26" stroke="#426D82" stroke-width="2"/>
      <text x="362" y="170" fill="#6EE7F9" font-size="48" font-weight="700">02</text>
      <text x="362" y="229" fill="#F5F7FA" font-size="38" font-weight="700">CLASSIFY</text>
    </g>

    <g id="stage-select">
      <rect x="622" y="104" width="244" height="164" rx="18"
            fill="#0D1B26" stroke="#426D82" stroke-width="2"/>
      <text x="646" y="170" fill="#6EE7F9" font-size="48" font-weight="700">03</text>
      <text x="646" y="229" fill="#F5F7FA" font-size="40" font-weight="700">SELECT</text>
    </g>

    <g id="stage-deliver">
      <rect x="906" y="104" width="240" height="164" rx="18"
            fill="#0D1B26" stroke="#426D82" stroke-width="2"/>
      <text x="930" y="170" fill="#6EE7F9" font-size="48" font-weight="700">04</text>
      <text x="930" y="229" fill="#F5F7FA" font-size="40" font-weight="700">DELIVER</text>
    </g>
  </g>
</svg>
