<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">The Project Atlas loop after the map</title>
  <desc id="desc">Current state becomes an evidence-backed finding, a ready task, a tested change, and a refreshed verified current state.</desc>

  <rect width="1200" height="380" rx="20" fill="#0A0C0F"/>
  <rect x="1" y="1" width="1198" height="378" rx="19"
        fill="none" stroke="#343A43" stroke-width="2"/>

  <g font-family="Arial, sans-serif">
    <text x="60" y="58" fill="#8D98A6" font-size="18" font-weight="650"
          letter-spacing="2">THE LOOP AFTER THE MAP</text>
    <text x="1140" y="58" fill="#5EA8FF" font-size="18" font-weight="700"
          text-anchor="end">CURRENT → VERIFIED CURRENT</text>
    <path d="M60 84H1140" stroke="#343A43" stroke-width="2"/>

    <path d="M82 174H1118" stroke="#5EA8FF" stroke-width="2"/>
    <g fill="#0A0C0F" stroke="#5EA8FF" stroke-width="3">
      <circle cx="82" cy="174" r="8"/>
      <circle cx="341" cy="174" r="8"/>
      <circle cx="600" cy="174" r="8"/>
      <circle cx="859" cy="174" r="8"/>
      <circle cx="1118" cy="174" r="8"/>
    </g>

    <g fill="#F4F6F8" font-size="24" font-weight="700">
      <text x="82" y="132" text-anchor="middle">CURRENT</text>
      <text x="341" y="132" text-anchor="middle">FINDING</text>
      <text x="600" y="132" text-anchor="middle">READY TASK</text>
      <text x="859" y="132" text-anchor="middle">CHANGE</text>
      <text x="1118" y="132" text-anchor="middle">VERIFIED</text>
    </g>

    <g fill="#8D98A6" font-size="18" font-weight="550">
      <text x="82" y="226" text-anchor="middle">source links</text>
      <text x="82" y="254" text-anchor="middle">and unknowns</text>
      <text x="341" y="226" text-anchor="middle">claim with</text>
      <text x="341" y="254" text-anchor="middle">evidence</text>
      <text x="600" y="226" text-anchor="middle">scope · non-goals</text>
      <text x="600" y="254" text-anchor="middle">acceptance</text>
      <text x="859" y="226" text-anchor="middle">bounded edit</text>
      <text x="859" y="254" text-anchor="middle">plus tests</text>
      <text x="1118" y="226" text-anchor="middle">map refreshed</text>
      <text x="1118" y="254" text-anchor="middle">gaps preserved</text>
    </g>

    <path d="M60 304H1140" stroke="#252A31" stroke-width="2"/>
    <text x="60" y="340" fill="#F4F6F8" font-size="20" font-weight="650">
      CLAIM → SOURCE → TASK → TEST → UPDATED CLAIM
    </text>
    <text x="1140" y="340" fill="#8D98A6" font-size="18" font-weight="600"
          text-anchor="end">NOT JUST DOCUMENTATION</text>
  </g>
</svg>
