<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="700" viewBox="0 0 1200 700"
     role="img" aria-labelledby="title desc">
  <title id="title">Как карта помогает в следующей задаче</title>
  <desc id="desc">Без карты помощник заново ищет устройство проекта. С картой он начинает с проверенных ссылок; ожидаемый эффект в виде меньшего числа лишних правок пока не измерен.</desc>

  <rect width="1200" height="700" rx="26" fill="#071018"/>
  <rect x="1.5" y="1.5" width="1197" height="697" rx="24.5"
        fill="none" stroke="#36576A" stroke-width="3"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="54" y="72" fill="#F8FAFC" font-size="52" font-weight="780">
      Зачем карта после создания
    </text>

    <g id="without-map">
      <rect x="54" y="116" width="516" height="520" rx="20"
            fill="#151C24" stroke="#6B7782" stroke-width="3"/>
      <text x="84" y="174" fill="#FCA5A5" font-size="44" font-weight="800">
        Без карты
      </text>
      <text x="84" y="250" fill="#F8FAFC" font-size="46" font-weight="700">
        Повторный поиск
      </text>
      <text x="84" y="312" fill="#AFC1CB" font-size="44" font-weight="650">
        входы · права
      </text>
      <text x="84" y="366" fill="#AFC1CB" font-size="44" font-weight="650">
        данные · тесты
      </text>
      <text x="84" y="474" fill="#F8FAFC" font-size="46" font-weight="700">
        Риск пропустить
      </text>
      <text x="84" y="532" fill="#AFC1CB" font-size="44" font-weight="650">
        связанную проверку
      </text>
    </g>

    <g id="with-map">
      <rect x="630" y="116" width="516" height="520" rx="20"
            fill="#102532" stroke="#67E8F9" stroke-width="3"/>
      <text x="660" y="174" fill="#86EFAC" font-size="44" font-weight="800">
        С картой Atlas
      </text>
      <text x="660" y="250" fill="#F8FAFC" font-size="46" font-weight="700">
        Проверенный старт
      </text>
      <text x="660" y="312" fill="#AFC1CB" font-size="44" font-weight="650">
        ссылки · связи
      </text>
      <text x="660" y="366" fill="#AFC1CB" font-size="44" font-weight="650">
        риски · UNKNOWN
      </text>
      <text x="660" y="458" fill="#F8FAFC" font-size="46" font-weight="700">
        Ожидаемый эффект
      </text>
      <text x="660" y="516" fill="#AFC1CB" font-size="44" font-weight="650">
        меньше лишних
      </text>
      <text x="660" y="566" fill="#AFC1CB" font-size="44" font-weight="650">
        правок
      </text>
      <text x="660" y="614" fill="#FCD34D" font-size="42" font-weight="760">
        ПОКА НЕ ИЗМЕРЕНО
      </text>
    </g>

    <path d="M584 376H616" stroke="#67E8F9" stroke-width="6" stroke-linecap="round"/>
    <path d="M603 358L625 376L603 394Z" fill="#67E8F9"/>
  </g>
</svg>
