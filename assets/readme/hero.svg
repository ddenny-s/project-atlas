<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">Project Atlas evidence route</title>
  <desc id="desc">A source becomes a classified claim, a reviewable atlas, and a durable engineering handoff.</desc>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L9 4.5L0 9Z" fill="#6EE7F9"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="28" fill="#071018"/>
  <rect x="1.5" y="1.5" width="1197" height="417" rx="26.5"
        fill="none" stroke="#426D82" stroke-width="3"/>

  <g id="title-block"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="64" fill="#6EE7F9" font-size="22" font-weight="700"
          letter-spacing="2.4">HOST-INDEPENDENT INVESTIGATION</text>

    <text x="62" y="158" fill="#F5F7FA" font-size="54" font-weight="700"
          letter-spacing="-1.5">MAP WHAT EXISTS.</text>
    <text x="62" y="226" fill="#F5F7FA" font-size="46" font-weight="700"
          letter-spacing="-1.2">TRACE MATERIAL CLAIMS.</text>

    <path d="M66 272H588" fill="none" stroke="#244356" stroke-width="2"/>
    <text x="64" y="318" fill="#C8D5DF" font-size="40" font-weight="600">
      FACTS ≠ INFERENCES
    </text>
    <text x="64" y="366" fill="#C8D5DF" font-size="40" font-weight="600">
      TARGETS ≠ UNKNOWNS
    </text>
  </g>

  <g id="evidence-route"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="676" y="48" width="476" height="324" rx="22"
          fill="#0A151F" stroke="#426D82" stroke-width="2"/>
    <text x="706" y="90" fill="#A8BAC8" font-size="22" font-weight="600"
          letter-spacing="1.5">EVIDENCE ROUTE</text>

    <path d="M912 150H938" fill="none" stroke="#6EE7F9"
          stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1033 202V220" fill="none" stroke="#6EE7F9"
          stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M938 272H912" fill="none" stroke="#6EE7F9"
          stroke-width="3" marker-end="url(#arrow)"/>

    <g id="node-source">
      <rect x="698" y="104" width="214" height="96" rx="14"
            fill="#0D1B26" stroke="#426D82" stroke-width="2"/>
      <circle cx="720" cy="128" r="7" fill="#8BD5A6"/>
      <text x="720" y="172" fill="#F5F7FA" font-size="40" font-weight="700">SOURCE</text>
    </g>

    <g id="node-claim">
      <rect x="938" y="104" width="190" height="96" rx="14"
            fill="#0D1B26" stroke="#426D82" stroke-width="2"/>
      <circle cx="960" cy="128" r="7" fill="#6EE7F9"/>
      <text x="960" y="172" fill="#F5F7FA" font-size="40" font-weight="700">CLAIM</text>
    </g>

    <g id="node-atlas">
      <rect x="938" y="222" width="190" height="96" rx="14"
            fill="#0D1B26" stroke="#426D82" stroke-width="2"/>
      <circle cx="960" cy="246" r="7" fill="#F6C177"/>
      <text x="960" y="290" fill="#F5F7FA" font-size="40" font-weight="700">ATLAS</text>
    </g>

    <g id="node-handoff">
      <rect x="698" y="222" width="214" height="96" rx="14"
            fill="#0D1B26" stroke="#426D82" stroke-width="2"/>
      <circle cx="720" cy="246" r="7" fill="#8BD5A6"/>
      <text x="720" y="290" fill="#F5F7FA" font-size="36" font-weight="700">HANDOFF</text>
    </g>

    <text x="706" y="347" fill="#6EE7F9" font-size="22" font-weight="700">
      REVIEWABLE BY DESIGN
    </text>
  </g>
</svg>
